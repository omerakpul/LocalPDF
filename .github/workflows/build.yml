name: Build and Test

# Runs on pull requests only (the same commits were already checked before merging),
# so merging into main does not trigger a second, duplicate build.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'screenshots/**'
  workflow_dispatch:

# A new push to the same PR cancels the older, now-useless run
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Caches Gradle dependencies and build outputs between runs
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # One Gradle invocation: compiles once, runs unit tests and builds the debug APK
      - name: Build and test
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain
